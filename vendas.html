<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vendas</title>

    <link rel="icon" href="imagens/favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="main.css">
</head>

<body>

    <header>
        <h1>Isadora ERP</h1>
    </header>

    <aside>
        <nav>
            <a href="main.html">Início</a>
            <a href="estoque.html">Estoque</a>
            <a href="vendas.html">Vendas</a>
            <a href="#">DRE</a>
        </nav>
    </aside>

    <main>

        <section class="vendas-header">

            <div>
                <h2>Vendas</h2>
                <p>Registro de vendas</p>
            </div>

            <button class="botao-nova-venda">
                + Registrar venda
            </button>

        </section>


        <section class="vendas-tabela">

            <div class="vendas-cabecalho">
                <span>Cliente</span>
                <span>Valor</span>
                <span>Pagamento</span>
                <span>Data</span>
            </div>


            <div class="venda">

                <span>João da Silva</span>

                <span>R$ 850,00</span>

                <span>À vista</span>

                <span>19/10/2026</span>

            </div>


            <div class="venda">

                <span>Maria Ltda.</span>

                <span>R$ 620,00</span>

                <span>À prazo</span>

                <span>18/10/2026</span>

            </div>


            <div class="venda">

                <span>Pedro & Cia</span>

                <span>R$ 450,00</span>

                <span>À vista</span>

                <span>17/10/2026</span>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; Christian Dessanti. Todos os direitos reservados.</p>
    </footer>

    <dialog class="modal-venda" open>  <!-- remover a clausula open após a implementação do JS -->

    <h2>Registrar venda</h2>

    <label for="cliente">Cliente:</label>
    <input type="text" id="cliente">

    <label for="valor">Valor:</label>
    <input type="number" id="valor" step="0.01">

    <label for="pagamento">Forma de pagamento:</label>
    <select id="pagamento">
        <option value="avista">À vista</option>
        <option value="aprazo">À prazo</option>
    </select>

    <label for="data-venda">Data da venda:</label>
    <input type="date" id="data-venda">

    <div class="botoes-modal-venda">
        <button type="button">Cancelar</button>
        <button type="button">Salvar</button>
    </div>

</dialog>

</body>

</html>
