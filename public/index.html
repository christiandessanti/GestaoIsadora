<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isadora ERP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="imagens/favicon.ico" type="image/x-icon">
</head>

<body>

    <main class="login-container">

        <h1> Gestão - Isadora </h1>

        <p>Faça o Login para acessar todas as funcionalidades</p>

        <form id="form-login" novalidate>

            <label for="usuario">Usuário:</label>
            <input type="text" id="usuario" name="usuario" autocomplete="username"
                   autocapitalize="none" spellcheck="false" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" required>

            <p id="erro-login" class="erro-login" role="alert" aria-live="polite"></p>

            <button type="submit">Entrar</button>

        </form>

    </main>

    <script type="module" src="js/login.js"></script>

</body>
</html>
